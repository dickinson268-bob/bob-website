<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkrun Comparison · Bob Dickinson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-subtle: #f5f5f3;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --border: #e0e0dc;
      --accent: #2563eb;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 720px;
      margin: 0 auto 2.5rem;
    }

    header a {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }

    header a:hover { color: var(--text); }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-top: 1rem;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Runner inputs */
    .runners-section { margin-bottom: 1.5rem; }

    .runner-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .runner-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    input[type="text"], input[type="number"] {
      font-family: var(--font);
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    .input-name { width: 120px; }
    .input-id   { width: 130px; }

    .btn-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
    }

    .btn-remove:hover { color: var(--text); }

    /* Buttons */
    button {
      font-family: var(--font);
      font-size: 14px;
      cursor: pointer;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      transition: background 0.15s;
    }

    .btn:hover { background: var(--bg-subtle); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Controls bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .toggle-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .toggle-group button {
      padding: 7px 14px;
      border: none;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 13px;
      border-right: 1px solid var(--border);
    }

    .toggle-group button:last-child { border-right: none; }

    .toggle-group button.active {
      background: var(--bg-subtle);
      color: var(--text);
      font-weight: 500;
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .date-range input { width: 68px; text-align: center; }

    /* Stats row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-subtle);
      border-radius: var(--radius);
      padding: 12px 14px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 600;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      margin-bottom: 1rem;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-line {
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }

    /* Error / status */
    .status-bar {
      font-size: 13px;
      color: var(--text-muted);
      min-height: 20px;
      margin-bottom: 1rem;
    }

    .error-text { color: #dc2626; }

    /* Footer note */
    .footnote {
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 0.5rem;
    }

    /* Row actions */
    .row-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<header>
  <a href="/">← Bob Dickinson</a>
  <h1>Parkrun comparison</h1>
  <p class="subtitle">Compare participation over time between any parkrunners</p>
</header>

<main>

  <div class="runners-section" id="runners-list"></div>

  <div class="row-actions">
    <button class="btn" onclick="addRunner()">+ Add runner</button>
    <button class="btn btn-primary" id="fetch-btn" onclick="fetchAll()">Compare</button>
  </div>

  <div class="status-bar" id="status"></div>

  <div class="controls">
    <div class="toggle-group">
      <button class="active" id="btn-runs" onclick="setMode('runs')">Cumulative runs</button>
      <button id="btn-events" onclick="setMode('events')">Distinct events</button>
    </div>
    <div class="date-range">
      <span>From</span>
      <input type="number" id="year-from" value="2019" min="2004" max="2030" onchange="renderChart()">
      <span>to</span>
      <input type="number" id="year-to" value="2025" min="2004" max="2030" onchange="renderChart()">
    </div>
  </div>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="chart-wrap">
    <canvas id="parkChart" role="img" aria-label="Line chart comparing parkrun participation over time"></canvas>
  </div>

  <div class="legend" id="legend"></div>

  <p class="footnote">
    Enter each runner's parkrun athlete ID — the number from their barcode, e.g. A1234567.
    Data is fetched from parkrun's public results pages.
  </p>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const COLORS = ['#2563eb','#16a34a','#dc2626','#9333ea','#d97706'];
  const DASHES = [[], [6,3], [3,3], [8,2,2,2], [4,4]];

  let runners = [
    { name: 'Runner 1', id: '' },
    { name: 'Runner 2', id: '' },
  ];

  // Fetched data keyed by athlete ID
  let data = {};
  let mode = 'runs';
  let chartInst = null;

  // --- Render runner input rows ---
  function renderInputs() {
    const list = document.getElementById('runners-list');
    list.innerHTML = runners.map((r, i) => `
      <div class="runner-row">
        <span class="runner-swatch" style="background:${COLORS[i % COLORS.length]}"></span>
        <input class="input-name" type="text" value="${r.name}" placeholder="Name"
          oninput="runners[${i}].name=this.value; renderChart();">
        <input class="input-id" type="text" value="${r.id}" placeholder="Athlete ID e.g. A12345"
          oninput="runners[${i}].id=this.value.trim();">
        ${runners.length > 1
          ? `<button class="btn-remove" onclick="removeRunner(${i})" aria-label="Remove runner">×</button>`
          : ''}
      </div>
    `).join('');
  }

  function addRunner() {
    if (runners.length >= 5) return;
    runners.push({ name: 'Runner ' + (runners.length + 1), id: '' });
    renderInputs();
  }

  function removeRunner(i) {
    const id = runners[i].id;
    runners.splice(i, 1);
    if (id) delete data[id];
    renderInputs();
    renderChart();
  }

  // --- Fetch data from our Netlify function ---
  async function fetchAll() {
    const btn = document.getElementById('fetch-btn');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.textContent = '';
    status.className = 'status-bar';

    const toFetch = runners.filter(r => r.id && !data[r.id]);

    if (toFetch.length === 0 && runners.some(r => r.id && data[r.id])) {
      renderChart();
      btn.disabled = false;
      return;
    }

    if (runners.every(r => !r.id)) {
      status.textContent = 'Enter at least one athlete ID to compare.';
      btn.disabled = false;
      return;
    }

    status.textContent = `Fetching data for ${toFetch.length} runner${toFetch.length !== 1 ? 's' : ''}…`;

    const results = await Promise.allSettled(
      toFetch.map(r =>
        fetch(`/.netlify/functions/parkrun?id=${encodeURIComponent(r.id)}`)
          .then(res => res.json())
          .then(json => ({ id: r.id, ...json }))
      )
    );

    const errors = [];
    for (const result of results) {
      if (result.status === 'fulfilled') {
        const d = result.value;
        if (d.error) {
          errors.push(d.error);
        } else {
          data[d.athleteId] = d;
          // Update name if we got one back
          const runner = runners.find(r => r.id === d.athleteId);
          if (runner && runner.name.startsWith('Runner ')) {
            runner.name = d.name;
          }
        }
      } else {
        errors.push('Network error fetching a runner.');
      }
    }

    renderInputs();
    renderChart();

    if (errors.length) {
      status.innerHTML = `<span class="error-text">${errors.join(' · ')}</span>`;
    } else {
      status.textContent = 'Loaded.';
    }

    btn.disabled = false;
  }

  // --- Build month labels for the date range ---
  function getLabels() {
    const from = parseInt(document.getElementById('year-from').value);
    const to   = parseInt(document.getElementById('year-to').value);
    const labels = [];
    for (let y = from; y <= to; y++) {
      for (let m = 1; m <= 12; m++) {
        labels.push(`${y}-${String(m).padStart(2, '0')}`);
      }
    }
    return labels;
  }

  function setMode(m) {
    mode = m;
    document.getElementById('btn-runs').className   = mode === 'runs'   ? 'active' : '';
    document.getElementById('btn-events').className = mode === 'events' ? 'active' : '';
    renderChart();
  }

  // --- Render stats cards ---
  function renderStats(labels) {
    const grid = document.getElementById('stats-grid');
    const cards = runners
      .filter(r => r.id && data[r.id])
      .map((r, i) => {
        const d = data[r.id];
        const src = mode === 'runs' ? d.runsByMonth : d.eventsByMonth;
        const lastVal = labels.reduceRight((acc, l) => acc !== null ? acc : (src[l] !== undefined ? src[l] : null), null) || 0;
        return `
          <div class="stat-card">
            <div class="stat-label" style="color:${COLORS[runners.indexOf(r) % COLORS.length]}">${r.name}</div>
            <div class="stat-value">${lastVal}</div>
            <div class="stat-sub">${mode === 'runs' ? 'runs' : 'venues'}</div>
          </div>`;
      });
    grid.innerHTML = cards.join('');
  }

  // --- Render legend ---
  function renderLegend() {
    const legend = document.getElementById('legend');
    legend.innerHTML = runners
      .filter(r => r.id && data[r.id])
      .map(r => {
        const i = runners.indexOf(r);
        return `<span class="legend-item">
          <span class="legend-line" style="background:${COLORS[i % COLORS.length]}"></span>
          ${r.name}
        </span>`;
      }).join('');
  }

  // --- Render chart ---
  function renderChart() {
    const labels = getLabels();
    renderStats(labels);
    renderLegend();

    const datasets = runners
      .filter(r => r.id && data[r.id])
      .map(r => {
        const i = runners.indexOf(r);
        const src = mode === 'runs' ? data[r.id].runsByMonth : data[r.id].eventsByMonth;
        return {
          label: r.name,
          data: labels.map(l => src[l] !== undefined ? src[l] : null),
          borderColor: COLORS[i % COLORS.length],
          backgroundColor: COLORS[i % COLORS.length] + '15',
          borderDash: DASHES[i % DASHES.length],
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          spanGaps: true,
        };
      });

    if (chartInst) chartInst.destroy();

    chartInst = new Chart(document.getElementById('parkChart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index',
            intersect: false,
            callbacks: {
              title: t => t[0].label,
              label: t => ` ${t.dataset.label}: ${Math.round(t.parsed.y)}`
            }
          }
        },
        scales: {
          x: {
            ticks: {
              autoSkip: true,
              maxTicksLimit: 10,
              color: '#6b6b6b',
              font: { size: 11 },
              callback: function(val) {
                const l = this.getLabelForValue(val);
                return l && l.endsWith('-01') ? l.slice(0, 4) : '';
              }
            },
            grid: { color: 'rgba(0,0,0,0.06)' }
          },
          y: {
            ticks: {
              color: '#6b6b6b',
              font: { size: 11 },
              callback: v => Math.round(v)
            },
            grid: { color: 'rgba(0,0,0,0.06)' },
            title: {
              display: true,
              text: mode === 'runs' ? 'Total runs' : 'Distinct venues',
              color: '#6b6b6b',
              font: { size: 11 }
            }
          }
        }
      }
    });
  }

  // Initialise
  renderInputs();
  renderChart();
</script>

</body>
</html>
